<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Notícias, Bluesky, xadrez e livros num lugar só." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Mural</title>
    <style>
      html,
      body {
        background: #0d0f12;
        margin: 0;
      }
      html[data-theme='claro'],
      html[data-theme='claro'] body {
        background: #f5f5f3;
      }
    </style>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('mural:prefs') || '{}');
        var t = p.theme || 'escuro';
        var dark = t === 'sistema' ? !matchMedia('(prefers-color-scheme: light)').matches : t !== 'claro';
        document.documentElement.dataset.theme = dark ? 'escuro' : 'claro';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O Mural precisa do JavaScript ligado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
